name: Build Gf Drps APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      extract_zip:
        description: "Extrair um ZIP da pasta raiz antes do build?"
        type: boolean
        required: true
        default: false
      zip_name:
        description: "Nome do ZIP na pasta raiz (ex.: arquivos.zip)"
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP da pasta raiz
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extract_zip }}
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [ -z "$ZIP_NAME" ]; then
            echo "Informe o nome do ZIP em zip_name."
            exit 1
          fi

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP não encontrado na pasta raiz: $ZIP_NAME"
            exit 1
          fi

          unzip -o "$ZIP_NAME" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O mecanismo de áudio é Java puro, então é testado antes de construir o APK.
      - name: Audio engine self-test
        run: |
          mkdir -p out
          javac -d out app/src/main/java/com/gfdrps/core/*.java test/SelfTest.java test/FixTest.java
          java -cp out SelfTest
          java -cp out FixTest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GfDrps-debug-apk
          path: app/build/outputs/apk/debug/GFDrps-debug.apk
          if-no-files-found: error

      - name: Remover ZIP
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.extract_zip }}
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [ -n "$ZIP_NAME" ] && [ -f "$ZIP_NAME" ]; then
            rm -f -- "$ZIP_NAME"
          fi
