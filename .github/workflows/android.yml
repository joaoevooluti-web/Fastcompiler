name: Build Gf Drps APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      extract_zip:
        description: "Extrair um ZIP da pasta raiz antes do build?"
        type: boolean
        required: true
        default: false
      zip_name:
        description: "Nome do ZIP na pasta raiz (ex.: arquivos.zip)"
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP da pasta raiz
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extract_zip }}
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [ -z "$ZIP_NAME" ]; then
            echo "Informe o nome do ZIP em zip_name."
            exit 1
          fi

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP não encontrado na pasta raiz: $ZIP_NAME"
            exit 1
          fi

          unzip -o "$ZIP_NAME" -d .

      - name: Conferir arquivos do projeto
        run: |
          echo "Diretório atual:"
          pwd
          echo "Arquivos Java encontrados:"
          find . -type f -name '*.java' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Localiza os arquivos do mecanismo de áudio, mesmo se estiverem
      # dentro de uma pasta adicional criada pela estrutura do ZIP.
      - name: Audio engine self-test
        shell: bash
        run: |
          mapfile -t CORE_FILES < <(
            find . -type f \
              -path '*/app/src/main/java/com/gfdrps/core/*.java' \
              ! -path './out/*' \
              | sort
          )

          TEST_FILES=()

          for test_file in test/SelfTest.java test/FixTest.java; do
            if [ -f "$test_file" ]; then
              TEST_FILES+=("$test_file")
            else
              echo "Arquivo de teste não encontrado: $test_file"
              exit 1
            fi
          done

          if [ "${#CORE_FILES[@]}" -eq 0 ]; then
            echo "Nenhum arquivo Java encontrado em */app/src/main/java/com/gfdrps/core/"
            echo "Arquivos Java disponíveis:"
            find . -type f -name '*.java' | sort
            exit 1
          fi

          mkdir -p out
          javac -d out "${CORE_FILES[@]}" "${TEST_FILES[@]}"
          java -cp out SelfTest
          java -cp out FixTest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GfDrps-debug-apk
          path: app/build/outputs/apk/debug/GFDrps-debug.apk
          if-no-files-found: error

      - name: Remover ZIP
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.extract_zip }}
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [ -n "$ZIP_NAME" ] && [ -f "$ZIP_NAME" ]; then
            rm -f -- "$ZIP_NAME"
            echo "ZIP removido: $ZIP_NAME"
          fi
