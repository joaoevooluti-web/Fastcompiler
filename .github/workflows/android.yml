name: Build Gf Drps APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIPs da raiz
        shell: bash
        run: |
          shopt -s nullglob
          zips=( *.zip )

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "Nenhum ZIP encontrado na raiz."
          else
            for zip_file in "${zips[@]}"; do
              echo "Extraindo: $zip_file"
              unzip -o "$zip_file" -d .
            done
          fi

      - name: Localizar projeto
        shell: bash
        run: |
          gradlew_path="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$gradlew_path" ]; then
            echo "Não foi encontrado o arquivo gradlew."
            echo "Conteúdo do repositório:"
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          project_dir="$(dirname "$gradlew_path")"
          project_dir="${project_dir#./}"

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $project_dir"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Audio engine self-test
        shell: bash
        run: |
          mapfile -t CORE_FILES < <(
            find "$PROJECT_DIR" -type f \
              -path '*/app/src/main/java/com/gfdrps/core/*.java' \
              | sort
          )

          self_test="$(find "$PROJECT_DIR" -type f -name SelfTest.java -print -quit)"
          fix_test="$(find "$PROJECT_DIR" -type f -name FixTest.java -print -quit)"

          if [ "${#CORE_FILES[@]}" -eq 0 ]; then
            echo "Não foram encontrados arquivos Java em app/src/main/java/com/gfdrps/core/."
            find "$PROJECT_DIR" -type f -name '*.java' | sort
            exit 1
          fi

          if [ -z "$self_test" ] || [ -z "$fix_test" ]; then
            echo "SelfTest.java ou FixTest.java não foi encontrado."
            find "$PROJECT_DIR" -type f -name '*.java' | sort
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/out"
          javac -d "$PROJECT_DIR/out" \
            "${CORE_FILES[@]}" \
            "$self_test" \
            "$fix_test"

          java -cp "$PROJECT_DIR/out" SelfTest
          java -cp "$PROJECT_DIR/out" FixTest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GfDrps-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/GFDrps-debug.apk
          if-no-files-found: error

      - name: Remover ZIPs da raiz
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          zips=( *.zip )

          if [ "${#zips[@]}" -gt 0 ]; then
            rm -f -- "${zips[@]}"
            echo "ZIPs da raiz removidos."
          else
            echo "Não há ZIPs para remover."
          fi
